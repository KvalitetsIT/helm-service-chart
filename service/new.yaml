apiVersion: batch/v1
kind: CronJob
metadata:
  name: kih-data-extract
  namespace: vdx
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            cronjob-name:  kih-data-extract
            app.kubernetes.io/instance: kih-dgwsxdsvalidationproxy-iti41
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: backup/deployment-name
                    operator: In
                    values:
                    - vdx-pexip-status
                namespaces:
                - vdx
                topologyKey: kubernetes.io/hostname
          containers:
          - name: kih-data-extract
            image: "kvalitetsit/kih-data-extract:1.2.4"
            imagePullPolicy: IfNotPresent
            env: 
            - name: GENERATE_DATA_FOR
              value: "yesterday"
            - name: INTEGRATION_TEST_SFTP_FILE_PATH
              value: "/folder/test"
            - name: INTEGRATION_TEST_SFTP_HOST
              value: "statistik.medcom.dk"
            - name: INTEGRATION_TEST_SFTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: sftp_password
                  name: kih-data-extract
            - name: INTEGRATION_TEST_SFTP_PORT
              value: "22"
            - name: INTEGRATION_TEST_SFTP_USERNAME
              value: "kvalitetsit"
            - name: SFTP_FILE_PATH
              value: "/folder/test"
            - name: SFTP_HOST
              value: "statistik.medcom.dk"
            - name: SFTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: sftp_password
                  name: kih-data-extract
            - name: SFTP_PORT
              value: "22"
            - name: SFTP_USERNAME
              value: "kvalitetsit"
            command: [
              "/bin/sh",
              "-c",
              "echo \"Running cronjob\"\nsleep 10\n"
            ]
            volumeMounts:
              - mountPath: /input
                name: jensjens
              - mountPath: /output
                name: jensjens
              - mountPath: /input
                name: input
              - mountPath: /output
                name: output
            resources:
              limits:
                cpu: 1
                memory: 1Gi
              requests:
                cpu: 1
                memory: 1Gi
          restartPolicy: Never
          volumes:
            - name: configmap
              configMap:
                name: vdx-pexip-status-config
            - name: jensjens
              persistentVolumeClaim:
                claimName: kih-iti41-logs
                readOnly: true
            - name: output
              persistentVolumeClaim:
                claimName: kih-data-extract
            - name: input2
              name: jensjens
              persistentVolumeClaim:
                claimName: kih-iti41-logs   
                readOnly: true
              
            - name: output2
              persistentVolumeClaim: 
                claimName: kih-data-extract
